<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Library — Sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1b26; color: #c0caf5;
  }
  .card {
    background: #24283b; padding: 32px; border-radius: 12px; width: min(360px, 90vw);
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #565f89; font-size: 13px; }
  label { display:block; font-size: 12px; color: #a9b1d6; margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #3b4261;
    background: #1f2335; color: #c0caf5; font-size: 15px;
  }
  input:focus { outline: none; border-color: #7aa2f7; }
  button {
    margin-top: 20px; width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: #7aa2f7; color: #1a1b26; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #89b4fa; }
  .error { color: #f7768e; font-size: 13px; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>📚 Open Library</h1>
    <p class="sub">Admin sign-in</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="error" id="err"></div>
  </form>
<script>
const form = document.getElementById('loginForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = 'Signing in…';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: username.value,
        password: password.value
      })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Login failed'; return; }
    if (data.opds_only) {
      err.textContent = 'This user has OPDS-only access. Use it in your e-reader OPDS catalog credentials.';
      return;
    }
    const next = "{{ next }}" || "/";
    window.location.href = next;
  } catch (ex) {
    err.textContent = 'Network error: ' + ex.message;
  }
});
</script>
</body>
</html>
