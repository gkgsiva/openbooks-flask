<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📚 Library Creator</title>
<style>
:root{--bg:#f4f7ff;--card:#ffffff;--ink:#1a2238;--muted:#6b7a99;--brand:#6c5ce7;--brand2:#00cec9;--ok:#00b894;--warn:#fdcb6e;--bad:#e17055;--link:#0984e3;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff,#f0fffd);color:var(--ink)}
header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(108,92,231,.35)}
header h1{margin:0;font-size:1.35rem}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tabs button{border:0;background:rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:600}
.tabs button.on{background:#fff;color:var(--brand)}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.page{display:none}
.page.on{display:block}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 4px 16px rgba(26,34,56,.08);padding:20px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 4px 16px rgba(26,34,56,.08)}
.stat b{display:block;font-size:2rem}
.stat small{color:var(--muted)}
.stat.t{border-top:5px solid var(--brand)} .stat.d{border-top:5px solid var(--ok)} .stat.p{border-top:5px solid var(--warn)} .stat.q{border-top:5px solid var(--link)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eef1f8;vertical-align:top}
th{cursor:pointer;user-select:none;color:var(--muted);text-transform:uppercase;font-size:.72rem;letter-spacing:.05em}
th.sorted-asc::after{content:" ▲"} th.sorted-desc::after{content:" ▼"}
tbody tr:hover{background:#f6f8ff}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:700}
.st-downloaded{background:#d9f7ee;color:var(--ok)} .st-pending{background:#fdf3d7;color:#b07d1a} .st-queued{background:#dcecfd;color:var(--link)} .st-running,.st-searching{background:#e8e3ff;color:var(--brand)} .st-uploading{background:#fff0d9;color:#9b6200} .st-paused,.st-error{background:#fde3dc;color:var(--bad)}
input,select,textarea{border:2px solid #e3e8f4;border-radius:8px;padding:8px 10px;font-size:.95rem;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--brand)}
button.btn{border:0;border-radius:10px;padding:9px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
button.btn:hover{filter:brightness(1.1)}
button.btn.teal{background:var(--brand2)} button.btn.ghost{background:#eef1fa;color:var(--ink)} button.btn.danger{background:var(--bad)} button.btn.ok{background:var(--ok)}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.searchbar input[type=text]{flex:1;min-width:220px}
.pbar{height:10px;border-radius:99px;background:#e8ecf7;overflow:hidden;margin:8px 0}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .5s}
.pbar.timeout>div{background:var(--bad)}
.note{font-size:.8rem;color:var(--muted)}
.dialog{position:fixed;inset:0;background:rgba(20,25,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
.dialog.on{display:flex}
.dialog .box{background:#fff;border-radius:var(--radius);padding:22px;width:min(480px,92vw);max-height:85vh;overflow:auto}
.dialog h3{margin:0 0 14px;color:var(--brand)}
.dialog label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 4px}
.dialog input,.dialog select,.dialog textarea{width:100%}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.cover{height:46px;width:31px;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.25);border-radius:3px;display:block}
table td{vertical-align:middle}
.tbl-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;position:sticky;bottom:0;background:#fff;padding:10px 0;border-top:2px solid #e3e8f4;z-index:5}
.list-panel{max-height:calc(100vh - 300px);min-height:220px;overflow:auto;border:1px solid #e3e8f4;border-radius:10px;padding:10px;background:#fff}
a{color:var(--link)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:.9rem;max-width:340px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:30px}
.row-dim td{opacity:.55}

/* table layout: no page-level horizontal scroll */
table{table-layout:auto;word-break:break-word}
.tbl-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
/* keep all tables aligned: stable columns, truncated overflow text */
table th,table td{vertical-align:middle;padding:6px 10px;white-space:nowrap}
table th{position:sticky;top:0;background:#fff;z-index:2;text-align:left}
table td.maxw{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table td.wrap{white-space:normal;min-width:120px;max-width:320px}

/* top progress bar for any network activity */
#busybar{position:fixed;top:0;left:0;right:0;height:4px;z-index:200;display:none}
#busybar.on{display:block}
#busybar .track{height:100%;width:100%;background:transparent}
#busybar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{width:0;margin-left:0}50%{width:70%;margin-left:15%}100%{width:0;margin-left:100%}}

/* download progress banner */
#dl-banner{display:none;position:sticky;top:0;z-index:60;background:#fff;border:2px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(108,92,231,.25)}
#dl-banner.on{display:block}
#dl-banner .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.busy-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;padding:14px 4px}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid var(--brand);border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite;flex:none}
.pbar.big{height:12px;margin:10px 0 4px}

/* ============ MOBILE ============ */
@media (max-width: 768px){
  header{padding:12px 14px;justify-content:center;text-align:center}
  header h1{font-size:1.1rem;width:100%}
  .tabs{margin:0 auto;justify-content:center;gap:4px}
  .tabs button{padding:7px 11px;font-size:.8rem}
  main{margin:14px auto;padding:0 10px}
  .card{padding:14px;border-radius:12px}
  .searchbar{flex-direction:column;gap:8px}
  .searchbar input[type=text],.searchbar select{width:100%;min-width:0}
  .searchbar button.btn{width:100%}
  .stat b{font-size:1.5rem}
  table{font-size:.82rem}
  th,td{padding:7px 8px}
  /* tables scroll horizontally inside their panel on small screens */
  .list-panel{overflow-x:auto;max-height:calc(100vh - 260px);padding:6px}
  .tbl-toolbar{flex-wrap:wrap;gap:8px}
  .tbl-toolbar input,.tbl-toolbar select{min-width:0;width:100%}
  .tbl-toolbar button.btn{flex:1 1 auto;font-size:.85rem;padding:8px 10px}
  .cover{height:38px;width:26px}
  #toast{left:12px;right:12px;bottom:12px;max-width:none}
  .dialog .box{padding:16px;width:94vw}
}
@media (max-width: 480px){
  table{font-size:.76rem}
  th,td{padding:6px 6px}
  .stat b{font-size:1.3rem}
}
</style>
</head>
<body>
<header>
  <h1>📚 Library Creator</h1>
  <div class="tabs" id="tabs">
    <button data-p="search" class="on">🔍 Search</button>
    <button data-p="library">📖 Library</button>
    <button data-p="authors">✍️ Authors</button>
    <button data-p="series">📚 Series</button>
    <button data-p="queue">⏳ Queue</button>
    <button data-p="drive">☁️ Drive</button>
    <button data-p="import">📥 Import</button>
    <button data-p="users">👥 Users</button>
  </div>
  <button id="logout-btn" onclick="doLogout()" title="Logout"
    style="margin-left:auto;background:none;border:none;color:#888;font-size:15px;cursor:pointer;padding:4px 8px">⏏ Logout</button>
</header>
<div id="busybar"><div class="track"><div class="fill"></div></div></div>
<main>
<div id="dl-banner"><div class="row"><span id="dl-b-txt">⬇ Downloading…</span></div><div class="pbar big"><div id="dl-b-fill" class="fill" style="width:0"></div></div></div>

<!-- SEARCH -->
<section class="page on" id="p-search">
  <div class="card">
    <div class="searchbar">
      <select id="s-type">
        <option value="book">Book / Title</option>
        <option value="author">Author</option>
        <option value="series">Series</option>
      </select>
      <select id="s-source" title="Metadata source">
        <option value="hardcover" selected>Hardcover (best series data)</option>
        <option value="both">Google + OpenLibrary</option>
        <option value="google">Google Books only</option>
        <option value="openlibrary">OpenLibrary only</option>
      </select>
      <input type="text" id="s-q" placeholder="Search books, authors… (e.g. Brandon Sanderson)">
      <button class="btn" id="s-go">Search</button>
    </div>
    <div id="s-area"></div>
  </div>
</section>

<!-- LIBRARY -->
<section class="page" id="p-library">
  <div class="stats" id="l-stats"></div>
  <div class="card">
    <div class="searchbar">
      <input type="text" id="l-filter" placeholder="Filter books…">
      <select id="l-author"></select>
      <select id="l-series"></select>
      <button class="btn teal" id="l-dl">⬇ Download Selected</button>
      <button class="btn danger" id="l-del" style="display:none">🗑 Delete Selected</button>
    </div>
    <div id="l-area"></div>
  </div>
</section>

<!-- AUTHORS -->
<section class="page" id="p-authors">
  <div class="card"><div class="searchbar"><input type="text" id="a-filter" placeholder="Filter authors…"></div><div id="a-area"></div></div>
</section>

<!-- SERIES -->
<section class="page" id="p-series">
  <div class="card"><div class="searchbar"><input type="text" id="se-filter" placeholder="Filter series…"></div><div id="se-area"></div></div>
</section>

<!-- QUEUE -->
<section class="page" id="p-queue">
  <div class="card">
    <div class="searchbar">
      <h3 style="margin:0;flex:1">Download queue</h3>
      <button class="btn danger" id="q-reset" title="Wipe all catalog data (books, authors, series, queue)">🗑 Reset All Data</button>
    </div>
    <div id="q-area"></div>
  </div>
</section>

<!-- DRIVE -->
<section class="page" id="p-drive">
  <div class="card">
    <div class="searchbar">
      <span id="d-crumbs" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <button class="btn" id="d-mkdir">📁 New Folder</button>
      <button class="btn" id="d-refresh">⟳</button>
      <button class="btn" id="d-undo" title="Go up one level" style="display:none">⬆ Up</button>
    </div>
    <div id="d-area"></div>
  </div>
</section>

<!-- IMPORT -->
<section class="page" id="p-import">
  <div class="card">
    <h3 style="margin-top:0">Import downloaded files</h3>
    <div id="i-files"></div>
  </div>
</section>

<section class="page" id="p-users">
  <div class="card">
    <h3 style="margin-top:0">👥 Users & OPDS access</h3>
    <p style="color:#666;font-size:13px">
      Regular users can only access the OPDS catalog (for KOReader/e-readers) —
      they sign in with their username/password in the OPDS catalog settings.
      The admin (you) has full access.
    </p>
    <div id="u-list"></div>
    <h4>Add user</h4>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="u-name" placeholder="username" style="flex:1;min-width:120px">
      <input id="u-pass" placeholder="password" type="password" style="flex:1;min-width:120px">
      <button onclick="userAdd()">Add</button>
    </div>
  </div>
</section>


</main>

<div class="dialog" id="dlg"><div class="box" id="dlg-box"></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let LIB={books:[],authors:[],series:[]};
let CELLS={}; // stored cell getters for sort

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
let busyN=0;function busy(on){busyN=Math.max(0,busyN+(on?1:-1));$('busybar').classList.toggle('on',busyN>0)}
async function api(p,opt){busy(true);try{
  const r=await fetch(p,Object.assign({headers:{'Content-Type':'application/json'}},opt));const j=await r.json().catch(()=>({}));if(!r.ok){toast('❌ '+(j.error||r.status));throw j}return j
}finally{busy(false)}}

/* tabs */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('p-'+b.dataset.p).classList.add('on');
  if(b.dataset.p==='library')loadLibrary();
  if(b.dataset.p==='authors')loadAuthors();
  if(b.dataset.p==='series')loadSeries();
  if(b.dataset.p==='queue')loadQueue();
  if(b.dataset.p==='drive')driveLoad();
  if(b.dataset.p==='import')loadFiles();
  if(b.dataset.p==='users')usersLoad();
});
function dlg(html){$('dlg-box').innerHTML=html;$('dlg').classList.add('on')}
function dlgClose(){$('dlg').classList.remove('on')}

/* sortable+searchable table builder: rows is array of objects; cols: {k,title,fmt,sort} */
function mkTable(container,rows,cols,opts={}){
  let skey=opts.sort||'' , sdir=opts.dir||1 , filt='';
  const wrap=document.createElement('div');
  if(opts.panel)wrap.className='list-panel';
  const finput=document.createElement('input');finput.type='text';finput.placeholder='Filter…';finput.style.margin='0 0 10px';finput.style.minWidth='240px';
  if(opts.filterInput){opts.filterInput.addEventListener('input',()=>{filt=opts.filterInput.value.toLowerCase();render()});finput.style.display='none'}
  else finput.addEventListener('input',()=>{filt=finput.value.toLowerCase();render()});
  const tbl=document.createElement('table');
  wrap.append(finput,tbl);container.innerHTML='';container.append(wrap);
  function val(r,k){const f=cols.find(c=>c.k===k);return f&&f.sort?f.sort(r):String(r[k]??'')}
  function render(){
    let data=[...rows];
    if(filt)data=data.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(filt)));
    if(skey)data.sort((a,b)=>{const x=val(a,skey),y=val(b,skey);return(x<y?-1:x>y?1:0)*sdir});
    tbl.innerHTML='';
    const thead=tbl.createTHead(),hr=thead.insertRow();
    if(opts.check){const th=document.createElement('th');const m=document.createElement('input');m.type='checkbox';m.title='Select all';
      m.onchange=()=>{tbl.querySelectorAll('tbody input[type=checkbox]').forEach(c=>{if(!c.disabled)c.checked=m.checked})};th.append(m);hr.append(th)}
    cols.forEach(c=>{const th=document.createElement('th');th.textContent=c.title;
      th.onclick=()=>{if(skey===c.k)sdir=-sdir;else{skey=c.k;sdir=1}render()};
      if(skey===c.k)th.className=sdir>0?'sorted-asc':'sorted-desc';hr.append(th)});
    if(opts.actions){const th=document.createElement('th');th.textContent='Actions';hr.append(th)}
    const tb=tbl.createTBody();
    if(!data.length){tb.insertRow().innerHTML=`<td colspan="99" class="empty">No results</td>`;return}
    data.forEach((r,i)=>{
      const tr=tb.insertRow();
      const off=opts.checkDisable&&opts.checkDisable(r);
      if(off)tr.className='row-dim';
      if(opts.check){const idx=rows.indexOf?rows.indexOf(r):i;const td=tr.insertCell();td.className=off?'dim-check':'';td.title=off?(opts.checkTitle||'Already in library'):'';
        td.innerHTML=`<input type="checkbox" data-idx="${idx}" ${r.id!==undefined&&r.id!==null&&r.id!==''?`data-id="${r.id}"`:''} ${off?'disabled':''}>`}
      cols.forEach(c=>{const td=tr.insertCell();td.innerHTML=c.fmt?c.fmt(r):(r[c.k]??'')});
      if(opts.actions){const td=tr.insertCell();td.innerHTML=opts.actions(r)}
    });
  }
  render();
  return{refresh:()=>{ /* re-render with same state */ render()}}
}

/* ============ SEARCH ============ */
$('s-go').onclick=doSearch;$('s-q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
let sTimer=null;
async function doSearch(){
  const q=$('s-q').value.trim(),t=$('s-type').value,src=$('s-source').value;
  if(!q)return;
  const area=$('s-area'),go=$('s-go');go.disabled=true;
  area.innerHTML=`<div class="busy-note"><span class="spinner"></span> Searching ${esc(src)} for “${esc(q)}”… (can take a few seconds)</div>`;
  try{const j=await api('/api/library/search',{method:'POST',body:JSON.stringify({q,type:t,source:src})}).catch(()=>({results:[]}));
    window._sresults=j.results||[];
    await ensureLib().catch(()=>{});}
  finally{go.disabled=false}
  renderSearch();
}
/* Match backend dedupe: title + author (author ignored when book has no author) */
function inLibrary(r){
  const t=(r.title||'').trim().toLowerCase();
  if(!t)return false;
  return (LIB.books||[]).some(b=>{
    if((b.title||'').trim().toLowerCase()!==t)return false;
    const sa=(r.author||'').trim().toLowerCase(),la=(b.author_name||b.author||'').trim().toLowerCase();
    return !sa||!la||sa===la;
  });
}
function renderSearch(){
  mkTable($('s-area'),window._sresults||[],[
    {k:'cover_url',title:'Cover',fmt:r=>r.cover_url?`<img class="cover" src="${r.cover_url}">`:'—',sort:r=>r.cover_url?1:0},
    {k:'title',title:'Title',fmt:r=>`<div class="maxw" title="${esc(r.title||'')}">${esc(r.title||'')}</div>`},
    {k:'author',title:'Author',fmt:r=>`<div class="maxw" title="${esc(r.author||'')}">${esc(r.author||'')}</div>`},
    {k:'series',title:'Series',fmt:r=>`<div class="maxw" title="${esc(r.series||'')}">${esc(r.series||'')}</div>`},
    {k:'series_num',title:'#',sort:r=>+r.series_num||0},
    {k:'year',title:'Year',sort:r=>+r.year||0},
    {k:'isbn',title:'ISBN'},
    {k:'language',title:'Lang'},
    {k:'source',title:'Source'},
  ],{check:true,panel:true,checkDisable:inLibrary,checkTitle:'Already in your library'});
  const tb=document.createElement('div');tb.className='tbl-toolbar';
  tb.innerHTML=`<button class="btn ghost" onclick="selAll('#s-area',true)">☑ Select All</button>
    <button class="btn ghost" onclick="selAll('#s-area',false)">☐ Clear</button>
    <button class="btn ok" onclick="addSelected()">Add Selected to Library</button>
    <button class="btn teal" onclick="addSelected(true)">Add + Download</button>`;
  const area=$('s-area');area.append(tb);
}

/* ============ LIBRARY ============ */
async function ensureLib(){ if(!LIB.books.length) await loadLibrary() }
async function loadLibrary(){
  const [b,a,s]=await Promise.all([
    api('/api/library/books'),api('/api/library/authors'),api('/api/library/series')]);
  LIB={books:b,authors:a,series:s};
  const sum=await api('/api/library/summary');
  $('l-stats').innerHTML=`
    <div class="stat t"><b>${sum.total_books}</b><small>Total books</small></div>
    <div class="stat d"><b>${sum.downloaded}</b><small>Downloaded ✅</small></div>
    <div class="stat p"><b>${sum.pending}</b><small>Pending ⏳</small></div>
    <div class="stat q"><b>${sum.in_queue}</b><small>In queue</small></div>`;
  const au=$('l-author');au.innerHTML='<option value="">All authors</option>'+a.map(x=>`<option>${x.name.replace(/</g,'&lt;')}</option>`).join('');
  const se=$('l-series');se.innerHTML='<option value="">All series</option>'+s.map(x=>`<option>${(x.name||'').replace(/</g,'&lt;')}</option>`).join('');
  renderLib();
}
function stBadge(r){const run=[r.queue_status].flat()[0]??r.queue_status;const q=(run&&typeof run==='object')?(run.status||''):r.queue_status;const st=r.status==='downloaded'?'downloaded':r.status==='queued'?'queued':['running','searching','downloading'].includes(q)?'running':r.status==='error'?'error':'pending';
  return `<span class="badge st-${st}">${st}</span>`}
function renderLib(){
  let rows=LIB.books;
  mkTable($('l-area'),rows,[
    {k:'cover_url',title:'',fmt:r=>r.cover_url?`<img class="cover" src="${r.cover_url}">`:'—',sort:r=>r.cover_url?1:0},
    {k:'title',title:'Title',fmt:r=>`<div class="maxw" title="${esc(r.title||'')}">${r.status==='downloaded'&&r.filename?`<a href="/api/library/books/${r.id}/file">${esc(r.title)}</a>`:esc(r.title)}</div>`},
    {k:'author_name',title:'Author',fmt:r=>`<div class="maxw" title="${esc(r.author_name||'')}">${esc(r.author_name||'')}</div>`},
    {k:'series_name',title:'Series',fmt:r=>`<div class="maxw" title="${esc(r.series_name||'')}">${esc(r.series_name||'')}</div>`},
    {k:'series_num',title:'#',sort:r=>+r.series_num||0},
    {k:'year',title:'Year',sort:r=>+r.year||0},
    {k:'isbn',title:'ISBN'},
    {k:'status',title:'Status',fmt:r=>stBadge(r)},

let _ircCands=[];
async function ircFind(id){
  dlg(`<h3>🔎 Search IRC for this book</h3>

let _driveCands=[];
async function driveMatch(id){
  dlg(`<h3>🔗 Link a Drive file</h3>
    <div class="busy-note"><span class="spinner"></span> Scanning Library folder in Drive…</div>`);
  let j;
  try{j=await api(`/api/library/books/${id}/drive-match`,{method:'POST',body:'{}'})}
  catch(e){dlgClose();return}
  if(j.error){dlgClose();toast('❌ '+j.error);return}
  const m=j.matches||[];
  _driveCands=m;
  if(!m.length){
    dlg(`<h3>🔗 Link a Drive file</h3>
      <p>No similar files found in your Drive Library.</p>
      <div class="row"><button class="btn ghost" onclick="dlgClose()">Close</button></div>`);

  }
  const rows=m.map((f,i)=>`
    <tr><td><div class="maxw" title="${esc(f.path)}">${esc(f.path)}</div></td>
        <td>${f.score}</td>
        <td><button class="btn teal" onclick="drivePick(${id},${i})">🔗 Link</button></td></tr>`).join('');
  dlg(`<h3>🔗 Link a Drive file (${m.length})</h3>

let qTimer=null;
function qWatch(){ /* start global poll (banner updates on every tab) */
  if(!qTimer)qTimer=setInterval(async()=>{try{await loadQueue()}catch(e){}},3000);
  loadQueue().catch(()=>{});
}
async function loadQueue(){
  const rows=await api('/api/library/queue/status');
  renderQueue(rows);
  const active=rows.filter(r=>['queued','searching','downloading','uploading','pending'].includes(r.status)).length;
  if(active===0&&qTimer){clearInterval(qTimer);qTimer=null}
}
function renderQueue(rows){
  mkTable($('q-area'),rows,[
    {k:'id',title:'#',sort:r=>+r.id},
    {k:'title',title:'Book',fmt:r=>`<div class="maxw" title="${esc(r.title||'')}">${esc(r.title||'')}</div>`},
    {k:'author_name',title:'Author',fmt:r=>`<div class="maxw" title="${esc(r.author_name||'')}">${esc(r.author_name||'')}</div>`},
  {k:'status',title:'Status',fmt:r=>`<span class="badge st-${r.status}">${r.status}</span>${r.retries>0&&r.status==='queued'?` <small class="muted">retry ${r.retries}/3</small>`:''}`},
    {k:'progress',title:'Progress',fmt:r=>['searching','uploading'].includes(r.status)
        ?`<div style="min-width:120px"><span class="busy-note" style="padding:0;font-size:.8rem"><span class="spinner"></span>${r.status==='uploading'?'uploading to Drive…':(r.phase==='connecting'?'connecting…':r.phase==='selecting'?'choosing source…':'searching…')}</span></div>`
        :r.status==='downloading'&&r.progress!=null
        ?`<div style="min-width:120px"><div class="pbar"><div class="fill" style="width:${Math.min(100,+r.progress)}%"></div></div><small>${r.progress}%</small></div>`
        :''},
    {k:'error',title:'Error',fmt:r=>`<div class="wrap" style="max-width:260px;font-size:.8rem" title="${esc(r.error||'')}">${esc(r.error||'')}</div>`},
  ],{});
  const act=rows.find(r=>['searching','downloading','uploading'].includes(r.status));
  const banner=$('dl-banner');
  if(act){banner.classList.add('on');
    $('dl-b-txt').textContent=`⬇ ${act.title||''} — ${act.status==='uploading'?'uploading to Drive…':act.status==='searching'?(act.phase==='connecting'?'connecting to IRC…':act.phase==='selecting'?'choosing source…':'searching IRC…'):'downloading '+(act.progress!=null?act.progress+'%':'')}`;
    if(act.progress!=null)$('dl-b-fill').style.width=Math.min(100,+act.progress)+'%';else $('dl-b-fill').style.width='40%';
  } else {
    const q=rows.filter(r=>['queued','pending'].includes(r.status)).length;
    if(q>0){banner.classList.add('on');$('dl-b-txt').textContent=`⏳ ${q} book(s) in download queue…`;$('dl-b-fill').style.width='15%'}
    else banner.classList.remove('on');
  }
}

function importForm(f){
  dlg(`<h3>📥 Import ${esc(f)}</h3>
    <label>Title</label><input id="i-title">
    <label>Author</label><input id="i-author">
    <label>Series</label><input id="i-series">
    <label>Series #</label><input id="i-num" type="number">
    <label>Year</label><input id="i-year" type="number">
    <div class="row"><button class="btn ghost" onclick="dlgClose()">Cancel</button><button class="btn" onclick="doImport('${esc(f)}')">Import</button></div>`);
}
async function doImport(f){
  await api('/api/library/import',{method:'POST',body:JSON.stringify({filename:f,
    title:$('i-title').value||undefined,author:$('i-author').value,series:$('i-series').value,
    series_num:+$('i-num').value||null,year:+$('i-year').value||null})});
  dlgClose();toast('✅ Imported');loadFiles();
}

async function doLogout(){
  await fetch('/logout',{method:'POST'});
  location.href='/login';
}
/* users admin */
async function usersLoad(){
  const users=await api('/users');
  const rows=users.map(u=>({name:u.username,admin:u.is_admin,
    created:(u.created_at||'').slice(0,10),id:u.id}));
  mkTable('u-list',rows,[
    {k:'name',title:'Username'},
    {k:'admin',title:'Admin',fmt:v=>v?'✅ admin':'OPDS only'},
    {k:'created',title:'Created'}
  ],{});
  const tbl=$('u-list').querySelector('table');if(!tbl)return;
  rows.forEach((r,i)=>{
    const td=tbl.rows[i+1].insertCell(-1);
    td.style.whiteSpace='nowrap';
    if(!r.admin){
      const bDel=document.createElement('button');bDel.textContent='🗑';bDel.title='Delete';
      bDel.onclick=async()=>{if(!confirm(`Delete user "${r.name}"?`))return;
        await api('/users/'+r.id,{method:'DELETE'});toast('✅ Deleted');usersLoad()};
      const bPw=document.createElement('button');bPw.textContent='🔑';bPw.title='Reset password';
      bPw.style.marginLeft='4px';
      bPw.onclick=async()=>{const p=prompt(`New password for "${r.name}":`);if(!p)return;
        await api(`/users/${r.id}/password`,{method:'POST',body:JSON.stringify({password:p})});
        toast('✅ Password updated')};
      td.append(bDel,bPw);
    } else td.textContent='';
  });
}
async function userAdd(){
  const n=$('u-name').value.trim(),p=$('u-pass').value;
  if(!n||p.length<4){toast('Username + password (min 4 chars) required');return}
  await api('/users',{method:'POST',body:JSON.stringify({username:n,password:p})});
  $('u-name').value='';$('u-pass').value='';toast('✅ User added');usersLoad();
}
loadLibrary();
qWatch();  /* checks queue once on load; polling self-stops when idle */
</script>
